name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Tests must pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --all-targets

  release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Build release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            printf '\n**Full Changelog**: %s/compare/%s...%s\n' \
              "${{ github.server_url }}/${{ github.repository }}" "$PREV" "${GITHUB_REF_NAME}" >> RELEASE_NOTES.md
          fi
          test -s RELEASE_NOTES.md  # fail the release if the section is missing
          echo '----- preview -----'; cat RELEASE_NOTES.md

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/notus dist/notus-x86_64-unknown-linux-gnu
          tar -C dist -czf dist/notus-x86_64-unknown-linux-gnu.tar.gz notus-x86_64-unknown-linux-gnu

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: dist/notus-x86_64-unknown-linux-gnu.tar.gz
