name: Benchmarks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  benchmark:
    name: Release-mode tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test --release
        run: cargo test --release --all-targets
