[package]
name = "notus"
version = "0.8.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Turn private notes into local knowledge packs and synthesized wikis"
readme = "README.md"
keywords = ["obsidian", "wiki", "llm", "ollama", "knowledge-management"]
categories = ["command-line-utilities", "text-processing"]
repository = "https://github.com/kytmanov/synto"
homepage = "https://github.com/kytmanov/synto"
authors = ["kytmanov"]
default-run = "notus"
include = [
    "src/**/*",
    "prompts/**/*",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[dependencies]
anyhow = "=1.0.95"
base64 = "=0.22.1"
caseless = "=0.2.1"
chrono = { version = "=0.4.38", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "=4.5.23", features = ["derive", "env", "wrap_help"] }
dialoguer = "=0.11.0"
directories = "=5.0.1"
fs2 = "=0.4.3"
hex = "=0.4.3"
indicatif = "=0.17.9"
notify = "=6.1.1"
once_cell = "=1.20.2"
pdf-extract = "=0.7.12"
regex = "=1.11.1"
reqwest = { version = "=0.12.9", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.216", features = ["derive"] }
serde_json = "=1.0.134"
serde_yaml = "=0.9.34"
sha2 = "=0.10.8"
tempfile = "=3.14.0"
thiserror = "=2.0.9"
toml = { version = "=0.8.19", features = ["preserve_order"] }
toml_edit = "=0.22.22"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter"] }
ulid = "=1.1.3"
unicode-normalization = "=0.1.24"
url = "=2.5.4"
walkdir = "=2.5.0"
zeroize = "=1.8.1"

[dev-dependencies]
pretty_assertions = "=1.4.1"
serial_test = "=3.2.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
